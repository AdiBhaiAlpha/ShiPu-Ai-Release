name: ShiPu AI Android Build (APK & AAB)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APKs & AAB Bundles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Validate and Repair Gradle Wrapper
        run: |
          if ! jar tf gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
            echo "WARNING: Gradle wrapper JAR is invalid, missing or corrupted! Downloading fresh official Gradle Wrapper..."
            mkdir -p gradle/wrapper

            GRADLE_VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\(.*\)-bin.zip/\1/' | sed 's/-all//')

            if [ -z "$GRADLE_VERSION" ]; then
              GRADLE_VERSION="8.14.3"
            fi

            curl -L \
            "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

            echo "Gradle Wrapper repaired successfully."
          else
            echo "SUCCESS: Gradle Wrapper JAR is valid."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode or Prepare Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f "debug.keystore" ] && [ ! -f "my-upload-key.jks" ]; then
            echo "Generating fallback debug keystore for CI build..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Build Debug & Release AAB Bundles (Android App Bundle)
        run: ./gradlew bundleDebug bundleRelease --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shipu-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: shipu-ai-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: shipu-ai-debug-aab
          path: app/build/outputs/bundle/debug/*.aab
          retention-days: 30

      - name: Upload Release AAB Bundle (Play Store Ready)
        uses: actions/upload-artifact@v4
        with:
          name: shipu-ai-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
