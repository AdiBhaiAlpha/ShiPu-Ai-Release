name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Validate and Repair Gradle Wrapper
      run: |
        if ! jar tf gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
          echo "WARNING: Gradle wrapper JAR is invalid, missing or corrupted! Downloading fresh official Gradle Wrapper..."
          mkdir -p gradle/wrapper

          GRADLE_VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\(.*\)-bin.zip/\1/' | sed 's/-all//')

          if [ -z "$GRADLE_VERSION" ]; then
            GRADLE_VERSION="8.14.3"
          fi

          curl -L \
          "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar" \
          -o gradle/wrapper/gradle-wrapper.jar

          echo "Gradle Wrapper repaired successfully."
        else
          echo "SUCCESS: Gradle Wrapper JAR is valid."
        fi

    - name: Ensure Debug Keystore
      run: |
        if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
          echo "Decoding debug.keystore from base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        fi

    - name: Build APK with Gradle
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shipu-ai-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
